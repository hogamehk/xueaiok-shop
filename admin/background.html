<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>網站背景（管理員） | 3388.HK</title>
  <link rel="stylesheet" href="/css/styles.css?v=bg2" />
  <link rel="stylesheet" href="/css/site-bg.css?v=bg2" />
  <style>
    .admin-only { max-width:560px; margin:24px auto; padding:0 16px 80px; }
    .admin-only .form-card { padding:20px; }
    .admin-gate { text-align:center; padding:48px 16px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/#/" aria-label="3388 首頁"><img class="logo-img" src="/images/logo-header.png?v=logo4" width="137" height="48" alt="3388.HK" /></a>
      <div class="header-actions"><a class="auth-link" href="/#/account">會員中心</a></div>
    </div>
  </header>
  <main class="admin-only">
    <div id="gate" class="form-card admin-gate"><p>檢查權限中…</p></div>
    <div id="panel" class="form-card admin-bg-box" hidden>
      <h1 style="font-size:22px;margin-bottom:8px">網站背景</h1>
      <p class="auth-lead">臨時管理頁（日後會移入正式後台）。支援 JPG／PNG／WebP，最大 5MB。</p>
      <img class="admin-bg-preview" id="bg-preview" alt="背景預覽" hidden />
      <label>選擇圖片<input type="file" id="bg-file" accept="image/jpeg,image/png,image/webp" /></label>
      <div class="admin-bg-actions">
        <button type="button" class="btn btn-accent" id="bg-apply">上傳並套用</button>
        <button type="button" class="btn btn-outline" id="bg-clear">移除，恢復預設</button>
      </div>
      <div class="auth-error" id="bg-error" hidden></div>
      <div class="demo-note" id="bg-ok" hidden></div>
      <p style="margin-top:16px;font-size:13px;color:#888"><a href="/#/">返回首頁</a></p>
    </div>
  </main>
  <script>
  (function () {
    function applyBg(settings) {
      var url = settings && settings.background_url;
      if (url) {
        document.body.classList.add("has-custom-bg");
        document.body.style.setProperty("--site-bg-image", "url(" + url + ")");
      } else {
        document.body.classList.remove("has-custom-bg");
        document.body.style.removeProperty("--site-bg-image");
      }
    }
    var gate = document.getElementById("gate");
    var panel = document.getElementById("panel");
    fetch("/api/me", { credentials: "include" }).then(function (r) {
      if (r.status === 401) { location.replace("/#/login"); return null; }
      return r.json();
    }).then(function (me) {
      if (!me) return;
      if (!me.is_admin) {
        gate.innerHTML = '<h2>403</h2><p>無權限存取此頁。</p><p><a href="/#/">返回首頁</a></p>';
        return;
      }
      gate.hidden = true; panel.hidden = false;
      var file = document.getElementById("bg-file"), preview = document.getElementById("bg-preview");
      var err = document.getElementById("bg-error"), ok = document.getElementById("bg-ok");
      fetch("/api/site-settings").then(function (r) { return r.json(); }).then(function (s) {
        applyBg(s);
        if (s.background_url) { preview.src = s.background_url; preview.hidden = false; }
      });
      file.addEventListener("change", function () {
        var f = file.files && file.files[0]; if (!f) return;
        if (f.size > 5 * 1024 * 1024) { err.textContent = "檔案不可超過 5MB"; err.hidden = false; file.value = ""; return; }
        preview.src = URL.createObjectURL(f); preview.hidden = false; err.hidden = true;
      });
      document.getElementById("bg-apply").addEventListener("click", function () {
        err.hidden = true; ok.hidden = true;
        var f = file.files && file.files[0];
        if (!f) { err.textContent = "請先選擇圖片"; err.hidden = false; return; }
        var fd = new FormData(); fd.append("file", f);
        fetch("/api/admin/background", { method: "POST", body: fd, credentials: "include" })
          .then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); })
          .then(function (x) {
            if (!x[0]) { err.textContent = x[1].error || "上傳失敗"; err.hidden = false; return; }
            applyBg(x[1]); preview.src = x[1].background_url; preview.hidden = false;
            ok.textContent = "已套用新背景"; ok.hidden = false;
          }).catch(function () { err.textContent = "無法連線伺服器"; err.hidden = false; });
      });
      document.getElementById("bg-clear").addEventListener("click", function () {
        if (!confirm("確定移除自訂背景，恢復預設？")) return;
        err.hidden = true; ok.hidden = true;
        fetch("/api/admin/background", { method: "DELETE", credentials: "include" })
          .then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); })
          .then(function (x) {
            if (!x[0]) { err.textContent = x[1].error || "操作失敗"; err.hidden = false; return; }
            applyBg(x[1]); preview.removeAttribute("src"); preview.hidden = true; file.value = "";
            ok.textContent = "已恢復預設背景"; ok.hidden = false;
          }).catch(function () { err.textContent = "無法連線伺服器"; err.hidden = false; });
      });
    }).catch(function () { gate.innerHTML = "<p>無法連線伺服器</p>"; });
  })();
  </script>
</body>
</html>
